<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F2D52" />
    <meta name="author" content="SCSi MARVHL" />

    <!-- Meta tags par page (title, description, canonical, Open Graph, Twitter Card, geo, JSON-LD page) -->
    <!-- Injectés au pré-rendu par scripts/prerender.mjs, gérés à l'hydratation par react-helmet-async. -->
    <!--ssr-head-->

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Schema.org global : identité de l'entreprise (identique sur toutes les pages) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RealEstateAgent",
      "name": "MARVHL – Bâtiment Galilée",
      "image": "https://www.marvhl.fr/og-image.jpg",
      "url": "https://www.marvhl.fr",
      "telephone": "+33756806404",
      "email": "contact.marvhl@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "12 rue Cantelaudette",
        "addressLocality": "Lormont",
        "postalCode": "33310",
        "addressRegion": "Nouvelle-Aquitaine",
        "addressCountry": "FR"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 44.87,
        "longitude": -0.52
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        "opens": "09:00",
        "closes": "18:00"
      },
      "areaServed": {
        "@type": "City",
        "name": "Bordeaux Métropole"
      }
    }
    </script>

    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>

  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
