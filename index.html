<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F2D52" />

    <!-- SEO de base (surchargé par React via le composant SEO, mais indispensable pour les crawlers et outils qui n'exécutent pas le JS : LinkedIn, WhatsApp, Slack, anciens navigateurs...) -->
    <title>MARVHL – Bureaux & Open-Spaces à louer à Lormont (Bordeaux) | Bâtiment Galilée</title>
    <meta name="description" content="Bureaux et open-spaces à louer à Lormont, 20 min de Bordeaux. Zone Franche Urbaine : exonérations fiscales jusqu'à 5 ans. Tout inclus, sans frais d'agence. Location directe propriétaire." />
    <meta name="author" content="SCSi MARVHL" />
    <link rel="canonical" href="https://www.marvhl.fr/" />

    <!-- Open Graph (LinkedIn, Facebook, WhatsApp, Slack...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MARVHL – Bâtiment Galilée, Lormont" />
    <meta property="og:title" content="MARVHL – Bureaux à louer à Lormont | Bâtiment Galilée" />
    <meta property="og:description" content="Bureaux et open-spaces à louer à Lormont. Zone Franche Urbaine, exonérations fiscales, tout inclus, sans frais d'agence." />
    <meta property="og:url" content="https://www.marvhl.fr/" />
    <meta property="og:image" content="https://www.marvhl.fr/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MARVHL – Bureaux à louer à Lormont | Bâtiment Galilée" />
    <meta name="twitter:description" content="Bureaux et open-spaces à louer à Lormont. Zone Franche Urbaine, exonérations fiscales, tout inclus, sans frais d'agence." />
    <meta name="twitter:image" content="https://www.marvhl.fr/og-image.jpg" />

    <!-- Geo -->
    <meta name="geo.region" content="FR-33" />
    <meta name="geo.placename" content="Lormont" />
    <meta name="geo.position" content="44.87;-0.52" />
    <meta name="ICBM" content="44.87, -0.52" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Schema.org : données structurées pour Google (RealEstateAgent + LocalBusiness) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RealEstateAgent",
      "name": "MARVHL – Bâtiment Galilée",
      "image": "https://www.marvhl.fr/og-image.jpg",
      "url": "https://www.marvhl.fr",
      "telephone": "+33756806404",
      "email": "contact.marvhl@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "12 rue Cantelaudette",
        "addressLocality": "Lormont",
        "postalCode": "33310",
        "addressRegion": "Nouvelle-Aquitaine",
        "addressCountry": "FR"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 44.87,
        "longitude": -0.52
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        "opens": "09:00",
        "closes": "18:00"
      },
      "areaServed": {
        "@type": "City",
        "name": "Bordeaux Métropole"
      }
    }
    </script>

    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
